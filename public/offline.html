<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>CAT CPNS - Offline</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: radial-gradient(900px 420px at 10% 0%, rgba(34, 211, 238, 0.18), transparent 55%),
                    radial-gradient(900px 420px at 90% 15%, rgba(59, 130, 246, 0.22), transparent 55%),
                    #0f172a;
        color: #f8fafc;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        max-width: 560px;
        width: 100%;
        border-radius: 20px;
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(30, 41, 59, 0.55);
        backdrop-filter: blur(16px) saturate(175%);
        box-shadow: 0 22px 55px rgba(0,0,0,0.44), inset 0 1px 0 rgba(255,255,255,0.10);
        padding: 22px 18px;
      }
      h1 { margin: 0 0 8px; font-size: 20px; letter-spacing: 0.01em; }
      p { margin: 0 0 14px; color: rgba(248,250,252,0.75); line-height: 1.45; }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        border-radius: 999px;
        padding: 12px 16px;
        font-weight: 800;
        letter-spacing: 0.01em;
        border: 1px solid rgba(255,255,255,0.16);
        background: linear-gradient(135deg, rgba(34,211,238,0.95), rgba(59,130,246,0.95));
        color: #fff;
        text-decoration: none;
      }
      .muted { font-size: 13px; color: rgba(248,250,252,0.65); margin-top: 12px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Kamu sedang offline</h1>
      <p>Beberapa halaman butuh koneksi internet, terutama halaman ujian dan generate. Silakan cek koneksi lalu coba lagi.</p>
      <a class="btn" href="/">
        <span>Reload</span>
      </a>
      <div class="muted">Tip: PWA tetap akan pakai data & tampilan terbaru dari server saat kamu online.</div>
    </div>
  </body>
</html>
