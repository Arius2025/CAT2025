[program:catcpns-pdf-generate]
directory=/var/www/cat-cpns
command=/usr/bin/php artisan queue:work database --queue=pdf-generate --sleep=2 --tries=1 --timeout=900
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/catcpns-pdf-generate.log
stopwaitsecs=920
